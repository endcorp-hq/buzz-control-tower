<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Control Tower vintage pilot hat</title>
  <desc id="desc">An ivory and navy golden-age pilot cap with a brass winged compass on a midnight blue field.</desc>
  <defs>
    <linearGradient id="field" x1="166" y1="112" x2="850" y2="910" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23354A"/>
      <stop offset="1" stop-color="#0B111D"/>
    </linearGradient>
    <linearGradient id="crown" x1="332" y1="250" x2="675" y2="605" gradientUnits="userSpaceOnUse">
