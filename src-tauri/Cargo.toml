[package]
name = "buzz-control-tower"
version = "0.1.0"
description = "Cross-platform Buzz agent observability companion"
authors = ["Buzz Control Tower contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "buzz_control_tower_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
